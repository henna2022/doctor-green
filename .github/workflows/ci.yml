name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 빌드 시 프리렌더링(/crops 등)에서 Supabase 클라이언트를 생성하는 데 필요.
      # NEXT_PUBLIC_* 값은 클라이언트 번들에 그대로 노출되는 공개 값이라 CI에서는
      # 실제 프로젝트 대신 더미 값을 사용한다 (실행 시점 API 호출은 하지 않음).
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
